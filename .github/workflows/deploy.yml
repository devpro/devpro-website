name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

env:
  node_version: "24"

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.node_version }}
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build static files
        run: npm run build
      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  index:
    needs: deploy
    runs-on: ubuntu-latest
    name: Send pages to IndexNow (Bing)
    steps:
      - uses: bojieyang/indexnow-action@v2
        with:
          sitemap-location: 'https://devpro.fr/sitemap.xml'
          key: ${{ secrets.INDEXNOW_KEY }}
