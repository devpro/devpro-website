name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: devpro/github-workflow-parts/.github/workflows/reusable-pages-deployment.yml@1711cf6d760e89fe43e3673dbd8986e355876cca
    with:
      # The IndexNow file proves the site owns the key the index job submits the pages with.
      build-command: |
        npm ci
        npm run build
        echo "$INDEXNOW_KEY" > "_site/${INDEXNOW_KEY}.txt"
      # The date of each page is read from the history.
      fetch-depth: 0
      job-name: Build website
      site-path: _site
      workflow-parts-version: 1711cf6d760e89fe43e3673dbd8986e355876cca
    secrets:
      additional-vars: |
        INDEXNOW_KEY=${{ secrets.INDEXNOW_KEY }}

  index:
    name: Send pages to IndexNow (Bing)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Submit the pages of the sitemap
        uses: devpro/github-workflow-parts/actions/indexnow/submit@1711cf6d760e89fe43e3673dbd8986e355876cca
        with:
          key: ${{ secrets.INDEXNOW_KEY }}
          sitemap-url: https://devpro.fr/sitemap.xml
