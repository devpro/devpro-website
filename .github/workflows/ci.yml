name: CI
# title: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: "${{ github.ref }}-ci"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  content-validate:
    name: Markup
    uses: devpro/github-workflow-parts/.github/workflows/reusable-markup-lint.yml@cf0d1a4e4cd55c9a1361c5c828c9452dc7c5569e

  code-build:
    name: "Code > Build"
    uses: devpro/github-workflow-parts/.github/workflows/reusable-pages-deployment.yml@cf0d1a4e4cd55c9a1361c5c828c9452dc7c5569e
    with:
      deploy: false
      site-path: _site
      workflow-parts-version: cf0d1a4e4cd55c9a1361c5c828c9452dc7c5569e
