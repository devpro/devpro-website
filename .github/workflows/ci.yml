name: CI
# title: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: "${{ github.ref }}-ci"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markup-lint:
    name: Markup
    uses: devpro/github-workflow-parts/.github/workflows/reusable-markup-lint.yml@8c856cd16adc8a0ca01c7889a9c7d98ad8593818

  code-build:
    name: "Code > Build"
    uses: devpro/github-workflow-parts/.github/workflows/reusable-pages-deployment.yml@8c856cd16adc8a0ca01c7889a9c7d98ad8593818
    with:
      deploy: false
      site-path: _site
      workflow-parts-version: 8c856cd16adc8a0ca01c7889a9c7d98ad8593818

  build-test:
    name: Build & Test
    uses: devpro/github-workflow-parts/.github/workflows/reusable-node-quality.yml@8c856cd16adc8a0ca01c7889a9c7d98ad8593818
    with:
      # Against the site the build script puts in _site, which the end-to-end server serves.
      custom-tests: npm run test:e2e
      job-name: Build & Test
      workflow-parts-version: 8c856cd16adc8a0ca01c7889a9c7d98ad8593818
